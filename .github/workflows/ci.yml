name: CI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'deploy/**'
      - 'src/**'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json
      - name: Install dependencies
        working-directory: src
        run: npm ci
      - name: Check code style
        working-directory: src
        run: npm run lint:check
      - name: Run unit tests
        working-directory: src
        run: npm run test
      - name: Audit production dependencies
        working-directory: src
        run: npm audit --omit=dev || true

  clear-stale-e2e-label:
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    steps:
      - name: Remove stale ready-to-merge label on new commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}" --remove-label "ready-to-merge" || true
