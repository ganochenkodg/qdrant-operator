apiVersion: v1
kind: Pod
metadata:
  name: demo-app
spec:
  containers:
    - image: dganochenko/demo-rag-app:2.0
      imagePullPolicy: Always
      name: rag
      command: ["/bin/sh"]
      args: ["-c", "sleep infinity"]
      resources:
        requests:
          memory: "2Gi"
          cpu: "1"
        limits:
          memory: "4Gi"
          cpu: "4"
      env:
        - name: QDRANT_URL
          value: http://my-cluster.default.svc.cluster.local:6333
