apiVersion: qdrant.operator/v1alpha1
kind: QdrantCollection
metadata:
  name: my-collection
spec:
  cluster: my-cluster
  vectorSize: 10
  distance: Cosine
  datatype: float32
  onDisk: false
  shardNumber: 6
  replicationFactor: 2
  sparseVectors:
    text-sparse:
      modifier: idf
  payloadIndexes:
    - fieldName: category
      fieldSchema: keyword
    - fieldName: description
      fieldSchema:
        type: text
        tokenizer: word
        lowercase: true
  config:
    hnsw_config:
      m: 16
      ef_construct: 100
      full_scan_threshold: 10000
    optimizers_config:
      deleted_threshold: 0.2
      vacuum_min_vector_number: 1000
    quantization_config:
      scalar:
        type: int8
        quantile: 0.5
        always_ram: true
  snapshots:
    s3EndpointURL: https://storage.googleapis.com/
    # s3EndpointURL: https://s3.amazonaws.com
    s3CredentialsSecretName: bucket-credentials
    bucketName: unique-bucket-for-shapshots
    # backupNow: true
    backupSchedule: "0 0 * * *"
    # restoreSnapshotName: my-cluster/my-collection/2024-01-21-23-38

