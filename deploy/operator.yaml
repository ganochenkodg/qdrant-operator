---
apiVersion: v1
kind: Namespace
metadata:
  name: qdrant-operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qdrant-operator-sa
  namespace: qdrant-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: qdrant-operator-role
rules:
  - apiGroups: ["qdrant.operator"]
    resources: ["qdrantclusters", "qdrantclusters/status", "qdrantcollections", "qdrantcollections/status"]
    verbs: ["get", "list", "create", "update", "delete", "patch", "watch"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "services"]
    verbs: ["get", "list", "create", "update", "delete", "patch", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "create", "update", "delete", "patch", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "create", "update", "patch", "delete", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "create", "update", "delete", "patch", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "create", "update", "delete", "patch", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: qdrant-operator-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: qdrant-operator-role
subjects:
  - kind: ServiceAccount
    name: qdrant-operator-sa
    namespace: qdrant-operator
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qdrant-operator-config
  namespace: qdrant-operator
data:
  CLUSTER_DOMAIN: "cluster.local"
  DEBUG_MODE: "false"
  NODE_OPTIONS: "--no-warnings"
  JOB_IMAGE: "dganochenko/qdrant-operator:0.4.0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant-operator
  namespace: qdrant-operator
  labels: &labels
    app: qdrant-operator
    component: operator
spec:
  replicas: 3
  selector:
    matchLabels: *labels
  template:
    metadata: 
      labels: *labels
    spec:
      serviceAccountName: qdrant-operator-sa
      terminationGracePeriodSeconds: 10
      containers:
      - name: operator
        image: dganochenko/qdrant-operator:0.4.0
        imagePullPolicy: Always
        ports:
        - name: health
          containerPort: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 3
          periodSeconds: 10
        # debug
        # command: ["/bin/sh"]
        # args: ["-c", "while true; do echo hello; sleep 10;done"]
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "256Mi"
            cpu: "1"
        envFrom:
        - configMapRef:
            name: qdrant-operator-config
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace

