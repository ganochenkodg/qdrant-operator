apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: qdrantclusters.qdrant.operator
  labels:
    app: qdrant-operator
spec:
  group: qdrant.operator
  names:
    plural: qdrantclusters
    singular: qdrantcluster
    kind: QdrantCluster
    shortNames: []
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Replicas
      description: The desired number of Qdrant replicas in the cluster
      jsonPath: .spec.replicas
      type: integer
    - name: Status
      description: The state of the custom resource
      jsonPath: .status.qdrantStatus
      type: string
    schema:
      openAPIV3Schema:
        description: "A Qdrant cluster definition"
        type: object
        required: ["kind", "apiVersion", "spec"]
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            description: "Specs of the Qdrant cluster"
            type: object
            x-kubernetes-validations:
            - rule: (self.apikey == 'false' && self.readApikey == 'false') || ( self.apikey != 'false')
              message: "spec.readApikey can be used only with spec.apikey enabled"
            - rule: (!has(self.jwtRbac) || !self.jwtRbac) || (self.apikey != 'false')
              message: "spec.jwtRbac can be used only with spec.apikey enabled"
            required: ["replicas","image"]
            properties:
              apikey:
                description: "Enable or disable or use pre-defined apikey"
                type: string
                default: "false"
              readApikey:
                description: "Enable or disable or use pre-defined readonly apikey"
                type: string
                default: "false"
              jwtRbac:
                description: "Enable JWT RBAC authentication in Qdrant"
                type: boolean
                default: false
              image:
                type: string
              config:
                description: "Custom Qdrant configuration"
                type: object
                x-kubernetes-preserve-unknown-fields: true
              replicas:
                type: integer
                minimum: 1
              service:
                type: string
                enum: ["ClusterIP", "NodePort", "LoadBalancer"]
                default: ClusterIP
              persistence:
                description: "Parameters for dynamic volume claims"
                type: object
                required: ["size"]
                properties:
                  size:
                    type: string
                    pattern: '^(\d+(e\d+)?|\d+(\.\d+)?(e\d+)?[EPTGMK]i?)$'
                  storageClassName:
                    type: string
                  accessModes:
                    type: array
                    items:
                      type: string
                    default: ["ReadWriteOnce"]
              probes:
                description: "HTTP/HTTPS probe settings for Qdrant container (/readyz, /livez)"
                type: object
                properties:
                  readiness:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        default: true
                      initialDelaySeconds:
                        type: integer
                        default: 5
                      periodSeconds:
                        type: integer
                        default: 10
                      timeoutSeconds:
                        type: integer
                        default: 2
                      failureThreshold:
                        type: integer
                        default: 6
                      successThreshold:
                        type: integer
                        default: 1
                  liveness:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        default: false
                      initialDelaySeconds:
                        type: integer
                        default: 15
                      periodSeconds:
                        type: integer
                        default: 15
                      timeoutSeconds:
                        type: integer
                        default: 2
                      failureThreshold:
                        type: integer
                        default: 5
                      successThreshold:
                        type: integer
                        default: 1
                  startup:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        default: false
                      initialDelaySeconds:
                        type: integer
                        default: 10
                      periodSeconds:
                        type: integer
                        default: 10
                      timeoutSeconds:
                        type: integer
                        default: 2
                      failureThreshold:
                        type: integer
                        default: 30
                      successThreshold:
                        type: integer
                        default: 1
              podSecurityContext:
                description: "Pod-level securityContext for Qdrant pods"
                type: object
                x-kubernetes-preserve-unknown-fields: true
              securityContext:
                description: "Container-level securityContext for Qdrant container"
                type: object
                x-kubernetes-preserve-unknown-fields: true
              serviceAccountName:
                type: string
              imagePullSecrets:
                type: array
                items:
                  type: object
                  required: ["name"]
                  properties:
                    name:
                      type: string
              env:
                description: "Additional environment variables for Qdrant container"
                type: array
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
              envFrom:
                description: "Additional envFrom sources (e.g. Secrets for native S3 snapshots)"
                type: array
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
              nodeSelector:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              podAnnotations:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              podLabels:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              sidecarContainers:
                type: array
                nullable: true
                default: []
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  required: ["name", "image"]
                  properties:
                    name:
                      type: string
                    image:
                      type: string
              additionalVolumes:
                type: array
                nullable: true
                default: []
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  required: ["name"]
                  properties:
                    name:
                      type: string
              additionalVolumeMounts:
                type: array
                nullable: true
                default: []
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  required: ["name", "mountPath"]
                  properties:
                    name:
                      type: string
                    mountPath:
                      type: string
              resources:
                type: object
                nullable: true
                default: {}
                properties:
                  limits:
                    type: object
                    properties:
                      cpu:
                        type: string
                        pattern: '^(\d+m|\d+(\.\d{1,3})?)$'
                      memory:
                        type: string
                        pattern: '^(\d+(e\d+)?|\d+(\.\d+)?(e\d+)?[EPTGMK]i?)$'
                  requests:
                    type: object
                    properties:
                      cpu:
                        type: string
                        pattern: '^(\d+m|\d+(\.\d{1,3})?)$'
                      memory:
                        type: string
                        pattern: '^(\d+(e\d+)?|\d+(\.\d+)?(e\d+)?[EPTGMK]i?)$'
              tls:
                type: object
                required: ["enabled"]
                default: {enabled: false}
                properties:
                  enabled:
                    type: boolean
                    default: false
                  secretName:
                    type: string
              # scheduling options
              tolerations:
                type: array
                nullable: true
                default: []
                items:
                  type: object
                  properties:
                    key:
                      type: string
                    operator:
                      type: string
                      enum:
                        - Equal
                        - Exists
                    value:
                      type: string
                    effect:
                      type: string
                      enum:
                        - NoExecute
                        - NoSchedule
                        - PreferNoSchedule
                    tolerationSeconds:
                      type: integer
              nodeAffinity:
                type: object
                nullable: true
                default: {}
                properties:
                  preferredDuringSchedulingIgnoredDuringExecution:
                    type: array
                    items:
                      type: object
                      required:
                      - preference
                      - weight
                      properties:
                        preference:
                          type: object
                          properties:
                            matchExpressions:
                              type: array
                              items:
                                type: object
                                required:
                                - key
                                - operator
                                properties:
                                  key:
                                    type: string
                                  operator:
                                    type: string
                                  values:
                                    type: array
                                    items:
                                      type: string
                            matchFields:
                              type: array
                              items:
                                type: object
                                required:
                                - key
                                - operator
                                properties:
                                  key:
                                    type: string
                                  operator:
                                    type: string
                                  values:
                                    type: array
                                    items:
                                      type: string
                        weight:
                          format: int32
                          type: integer
                  requiredDuringSchedulingIgnoredDuringExecution:
                    type: object
                    required:
                    - nodeSelectorTerms
                    properties:
                      nodeSelectorTerms:
                        type: array
                        items:
                          type: object
                          properties:
                            matchExpressions:
                              type: array
                              items:
                                type: object
                                required:
                                - key
                                - operator
                                properties:
                                  key:
                                    type: string
                                  operator:
                                    type: string
                                  values:
                                    type: array
                                    items:
                                      type: string
                            matchFields:
                              type: array
                              items:
                                type: object
                                required:
                                - key
                                - operator
                                properties:
                                  key:
                                    type: string
                                  operator:
                                    type: string
                                  values:
                                    type: array
                                    items:
                                      type: string
              podAntiAffinity:
                type: object
                nullable: true
                default: {}
                properties:
                  preferredDuringSchedulingIgnoredDuringExecution:
                    type: array
                    items:
                      type: object
                      properties:
                        podAffinityTerm:
                          type: object
                          properties:
                            labelSelector:
                              type: object
                              properties:
                                matchExpressions:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      key:
                                        type: string
                                      operator:
                                        type: string
                                      values:
                                        type: array
                                        items:
                                          type: string
                                matchLabels:
                                  x-kubernetes-preserve-unknown-fields: true
                                  type: object
                            namespaceSelector:
                              type: object
                              properties:
                                matchExpressions:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      key:
                                        type: string
                                      operator:
                                        type: string
                                      values:
                                        type: array
                                        items:
                                          type: string
                                matchLabels:
                                  x-kubernetes-preserve-unknown-fields: true
                                  type: object
                            namespaces:
                              type: array
                              items:
                                type: string
                            topologyKey:
                              type: string
                        weight:
                          type: integer
                  requiredDuringSchedulingIgnoredDuringExecution:
                    type: array
                    items:
                      type: object
                      properties:
                        labelSelector:
                          type: object
                          properties:
                            matchExpressions:
                              type: array
                              items:
                                type: object
                                properties:
                                  key:
                                    type: string
                                  operator:
                                    type: string
                                  values:
                                    type: array
                                    items:
                                      type: string
                            matchLabels:
                              x-kubernetes-preserve-unknown-fields: true
                              type: object
                        namespaceSelector:
                          type: object
                          properties:
                            matchExpressions:
                              type: array
                              items:
                                type: object
                                properties:
                                  key:
                                    type: string
                                  operator:
                                    type: string
                                  values:
                                    type: array
                                    items:
                                      type: string
                            matchLabels:
                              x-kubernetes-preserve-unknown-fields: true
                              type: object
                        namespaces:
                          type: array
                          items:
                            type: string
                        topologyKey:
                          type: string
              topologySpreadConstraints:
                type: array
                nullable: true
                default: []
                items:
                  type: object
                  properties:
                    labelSelector:
                      type: object
                      properties:
                        matchExpressions:
                          type: array
                          items:
                            type: object
                            properties:
                              key:
                                type: string
                              operator:
                                type: string
                              values:
                                type: array
                                items:
                                  type: string
                        matchLabels:
                          x-kubernetes-preserve-unknown-fields: true
                          type: object
                    matchLabelKeys:
                      type: array
                      items:
                        type: string
                    maxSkew:
                      type: integer
                    minDomains:
                      type: integer
                    nodeAffinityPolicy:
                      type: string
                    nodeTaintsPolicy:
                      type: string
                    topologyKey:
                      type: string
                    whenUnsatisfiable:
                      type: string
          status:
            type: object
            properties:
              qdrantStatus:
                type: string
